[project]
name = "llm-load-balancer"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jsonschema>=4.20",
    "mcp>=1.0",
]

[project.scripts]
llb = "llm_load_balancer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llm_load_balancer"]

[tool.setuptools.package-dir]
llm_load_balancer = "."
